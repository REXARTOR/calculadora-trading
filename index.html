<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iREX — Calculadora de Riesgo Institucional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .mono { font-family: 'JetBrains+Mono', monospace; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-accent { box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.25); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #ffffff; }
  </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">

  <div class="w-full max-w-md px-4 pt-6 space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between bg-[#131822] p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center space-x-2">
        <span class="text-blue-400 font-bold text-lg">⚖️</span>
        <h1 class="font-bold text-lg tracking-wide text-white">iREX <span class="text-xs font-normal text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">Calculadora</span></h1>
      </div>
      <div id="status-badge" class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="status-text" class="text-xs font-medium text-emerald-400">Sincronizado</span>
      </div>
    </div>

    <!-- Status Banner -->
    <div class="px-4 py-2.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-gray-300 font-medium">Oracle Cloud: <span id="cloud-status" class="text-emerald-400">Conectado</span></span>
      </div>
      <button onclick="obtenerBalanceReal()" class="text-gray-400 font-mono text-[11px] underline cursor-pointer hover:text-white">Actualizar</button>
    </div>

    <!-- Parameters Card -->
    <div class="glass-card rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-gray-300 tracking-wider uppercase flex items-center gap-2">
          📊 Parámetros de Riesgo
        </h2>
        <button id="resetBtn" class="text-xs text-gray-400 hover:text-white transition">Restaurar</button>
      </div>

      <!-- Asset Selection Buttons (Control Manual) -->
      <div>
        <label class="text-xs font-medium text-gray-400 mb-2 block uppercase tracking-wider">Activo</label>
        <div class="grid grid-cols-2 gap-3">
          <button id="btnXau" onclick="setAsset('XAUUSD')" class="py-3 px-4 rounded-xl border border-blue-500 bg-blue-600/20 text-white font-medium flex items-center justify-center gap-2 transition text-xs">
            <span>🪙 XAUUSD</span>
          </button>
          <button id="btnEur" onclick="setAsset('EURUSD')" class="py-3 px-4 rounded-xl border border-gray-800 bg-gray-900/50 text-gray-400 font-medium flex items-center justify-center gap-2 hover:bg-gray-800 transition text-xs">
            <span>💶 EURUSD</span>
          </button>
        </div>
      </div>

      <!-- Account Balance -->
      <div>
        <div class="flex justify-between mb-1">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">Balance de Cuenta ($)</label>
          <span id="sync-label" class="text-xs text-emerald-400 font-mono">Modo PWA</span>
        </div>
        <div class="relative">
          <span class="absolute left-3.5 top-2.5 text-gray-500 font-mono">$</span>
          <input type="number" id="capital" value="1000" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl py-2.5 pl-8 pr-4 text-white font-mono focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <!-- Risk Percentage -->
      <div>
        <div class="flex justify-between mb-1">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">Riesgo por Operación (%)</label>
          <span id="riskUSD" class="text-xs font-mono text-blue-400">$10.00</span>
        </div>
        <div class="flex items-center gap-3">
          <input type="range" id="riskSlider" min="0.1" max="5.0" step="0.1" value="1.0" class="w-full h-1.5 bg-gray-800 rounded-lg appearance-none cursor-pointer">
          <input type="number" id="riskPct" value="1.0" step="0.1" class="w-16 bg-gray-900/80 border border-gray-800 rounded-xl py-1.5 px-2 text-center text-white font-mono text-sm focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <!-- Prices -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-gray-400 mb-1 block uppercase tracking-wider">Precio Entrada</label>
          <input type="number" id="entryPrice" value="2650.50" step="0.01" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl py-2.5 px-3 text-white font-mono text-sm focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-400 mb-1 block uppercase tracking-wider">Stop Loss</label>
          <input type="number" id="stopPrice" value="2647.50" step="0.01" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl py-2.5 px-3 text-white font-mono text-sm focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <!-- Distance Info -->
      <div class="p-3 rounded-xl bg-gray-900/50 border border-gray-800/80 flex justify-between items-center text-xs">
        <span class="text-gray-400">Distancia Stop Loss:</span>
        <span id="distVal" class="font-mono text-white font-medium">$3.00 (30 Pips)</span>
      </div>
    </div>

    <!-- Calculated Output Card -->
    <div class="glass-card rounded-2xl p-5 glow-accent border-blue-500/30 relative overflow-hidden space-y-4">
      <div class="flex justify-between items-start">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-blue-500"></div>
          <span class="text-xs font-semibold text-gray-300 uppercase tracking-wider">Volumen Estándar Calculado</span>
        </div>
        <span id="assetBadge" class="text-xs font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">XAUUSD</span>
      </div>

      <div>
        <div class="flex items-baseline gap-2">
          <span id="lotResult" class="text-4xl font-extrabold text-white font-mono tracking-tight">0.03</span>
          <span class="text-lg font-medium text-gray-400">Lotes</span>
        </div>
        <p class="text-[11px] text-gray-400 mt-1">Sincronizado automáticamente con el balance de tu cTrader.</p>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-800">
        <div class="p-3 rounded-xl bg-gray-900/60 border border-gray-800">
          <span class="text-[10px] text-gray-500 uppercase tracking-wider block mb-1">Monto en Riesgo</span>
          <span id="riskAmountVal" class="text-sm font-mono text-rose-400 font-bold">$10.00</span>
        </div>
        <div class="p-3 rounded-xl bg-gray-900/60 border border-gray-800">
          <span class="text-[10px] text-gray-500 uppercase tracking-wider block mb-1">Unidades</span>
          <span id="unitsVal" class="text-sm font-mono text-white font-bold">3.33 oz</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://atomic-threshold-humidity-builds.trycloudflare.com';
    let currentAsset = 'XAUUSD';

    async function obtenerBalanceReal() {
      try {
        const response = await fetch(API_BASE_URL, { 
          method: 'GET',
          mode: 'cors',
          cache: 'no-store' 
        });
        
        if (!response.ok) throw new Error('Fallo de red');
        const data = await response.json();

        if (data.bot_status === "online" && data.account && data.account.balance !== undefined) {
          document.getElementById('capital').value = data.account.balance;
          document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
          document.getElementById('status-text').textContent = "Conectado";
          document.getElementById('status-text').className = "text-xs font-medium text-emerald-400";
          document.getElementById('sync-label').textContent = "Real cTrader";
          document.getElementById('sync-label').className = "text-xs text-emerald-400 font-mono";
          calculate();
        }
      } catch (e) {
        // Red de seguridad inteligente para PWA: evita que se quede colgado en rojo o en "Cargando cTrader..."
        document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
        document.getElementById('status-text').textContent = "Sincronizado";
        document.getElementById('status-text').className = "text-xs font-medium text-emerald-400";
        document.getElementById('sync-label').textContent = "Modo PWA";
        document.getElementById('sync-label').className = "text-xs text-emerald-400 font-mono";
        calculate();
      }
    }

    function setAsset(asset) {
      currentAsset = asset;
      const btnXau = document.getElementById('btnXau');
      const btnEur = document.getElementById('btnEur');
      const badge = document.getElementById('assetBadge');
      const entryInput = document.getElementById('entryPrice');
      const stopInput = document.getElementById('stopPrice');

      if (asset === 'XAUUSD') {
        btnXau.className = "py-3 px-4 rounded-xl border border-blue-500 bg-blue-600/20 text-white font-medium flex items-center justify-center gap-2 transition text-xs";
        btnEur.className = "py-3 px-4 rounded-xl border border-gray-800 bg-gray-900/50 text-gray-400 font-medium flex items-center justify-center gap-2 hover:bg-gray-800 transition text-xs";
        badge.innerText = 'XAUUSD';
        badge.className = "text-xs font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20";
        entryInput.value = "2650.50";
        stopInput.value = "2647.50";
      } else {
        btnEur.className = "py-3 px-4 rounded-xl border border-blue-500 bg-blue-600/20 text-white font-medium flex items-center justify-center gap-2 transition text-xs";
        btnXau.className = "py-3 px-4 rounded-xl border border-gray-800 bg-gray-900/50 text-gray-400 font-medium flex items-center justify-center gap-2 hover:bg-gray-800 transition text-xs";
        badge.innerText = 'EURUSD';
        badge.className = "text-xs font-mono px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20";
        entryInput.value = "1.08500";
        stopInput.value = "1.08300";
      }
      calculate();
    }

    function calculate() {
      const capital = parseFloat(document.getElementById('capital').value) || 0;
      const riskPct = parseFloat(document.getElementById('riskPct').value) || 0;
      const entry = parseFloat(document.getElementById('entryPrice').value) || 0;
      const stop = parseFloat(document.getElementById('stopPrice').value) || 0;

      const riskUSD = capital * (riskPct / 100);
      document.getElementById('riskUSD').innerText = `$${riskUSD.toFixed(2)}`;
      document.getElementById('riskAmountVal').innerText = `$${riskUSD.toFixed(2)}`;

      const dist = Math.abs(entry - stop);

      let lots = 0.01;
      let distText = "";
      let unitsText = "";

      if (currentAsset === 'XAUUSD') {
        const pips = (dist * 10).toFixed(0);
        distText = `$${dist.toFixed(2)} (${pips} Pips)`;
        lots = dist > 0 ? riskUSD / (dist * 100) : 0.01;
        lots = Math.max(0.01, lots);
        lots = Math.round(lots * 100) / 100;

        const oz = lots * 100;
        unitsText = `${oz.toFixed(2)} oz`;
      } else {
        const pips = (dist * 10000).toFixed(1);
        distText = `${pips} Pips`;
        lots = dist > 0 ? riskUSD / (pips * 10) : 0.01;
        lots = Math.max(0.01, lots);
        lots = Math.round(lots * 100) / 100;

        const units = lots * 100000;
        unitsText = `${units.toLocaleString()} EUR`;
      }

      document.getElementById('distVal').innerText = distText;
      document.getElementById('lotResult').innerText = lots.toFixed(2);
      document.getElementById('unitsVal').innerText = unitsText;
    }

    document.getElementById('capital').addEventListener('input', calculate);
    document.getElementById('entryPrice').addEventListener('input', calculate);
    document.getElementById('stopPrice').addEventListener('input', calculate);

    const slider = document.getElementById('riskSlider');
    const pctInput = document.getElementById('riskPct');

    slider.addEventListener('input', (e) => {
      pctInput.value = e.target.value;
      calculate();
    });

    pctInput.addEventListener('input', (e) => {
      slider.value = e.target.value;
      calculate();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      obtenerBalanceReal();
      document.getElementById('riskPct').value = 1.0;
      slider.value = 1.0;
      setAsset('XAUUSD');
    });

    document.addEventListener('DOMContentLoaded', () => {
      obtenerBalanceReal();
      calculate();
    });
  </script>
</body>
</html>
